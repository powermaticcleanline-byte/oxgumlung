<head>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no">
<title>ก้อนกล้าม · แอปฝึกของฉัน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: นุ่ม อบอุ่น น่ารัก กวนนิดๆ ใช้ฝึกจริงในยิม
   IDEA: วิดเจ็ตพาสเทลแบบสมุดบันทึกนิสัย หน้ากลมๆ บอกอารมณ์แต่ละวัน
   PICTURE: น้องก้อนกล้าม + การ์ดพาสเทล (บันทึกสัปดาห์ เป้าหมาย เวลาฝึก) + เมนูกระจก
   COLOUR and TYPE: ฟ้าอ่อนเป็นพื้น การ์ดเขียว/เหลือง/พีช ตัวหนังสือน้ำตาลเข้ม ปุ่มน้ำตาลไหม้ / Mitr + Mali + Itim
   LAYOUT: เฟรม 560px คอลัมน์เดียว เมนูกระจกลอยล่าง หน้าย่อยมีปุ่มย้อนกลับ */
:root{color-scheme:light dark;
--bg:light-dark(#d9ecff,#121a26);--card:light-dark(#ffffff,#1d2838);--ink:light-dark(#4a2c22,#f6ebe4);--mute:light-dark(#7a5a4c,#c9b3a8);

--t-lime:light-dark(#e3f5d4,#1f3324);--t-yellow:light-dark(#fff1bf,#3a3218);--t-orange:light-dark(#ffe6dd,#3a2520);
--t-sky:light-dark(#dcecff,#1c2c44);--t-violet:light-dark(#ece4ff,#2a2444);--t-pink:light-dark(#ffdce8,#3a2030);
--s-lime:#7fdc9a;--s-yellow:#ffd36b;--s-sky:#8cc8ff;--s-violet:#b49cff;--s-pink:#ff9ec4;--s-orange:#f6a08e;
--btn:light-dark(#6b2e1f,#ffb59e);--btn-ink:light-dark(#ffffff,#3a1a10);--ok:#7fdc9a;--ok-t:light-dark(#e3f5d4,#1f3a28);--red:light-dark(#c2382b,#ff8a7e);
--nav:light-dark(rgba(240,247,255,.84),rgba(29,40,56,.86));--navon:light-dark(#cfe0f2,#33465f);

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Mali,Mitr,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}

#app{max-width:560px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right)) calc(130px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100dvh}
body.full #app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.tint{box-shadow:none}
.t-lime{background:var(--t-lime)}.t-yellow{background:var(--t-yellow)}.t-orange{background:var(--t-orange)}.t-sky{background:var(--t-sky)}.t-violet{background:var(--t-violet)}.t-pink{background:var(--t-pink)}
.pri{background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:0 22px;min-height:48px}
.sec{background:var(--chip);border-radius:99px;padding:0 18px}
.ghost{color:var(--ink);font-weight:500;padding:0 8px;display:inline-flex;align-items:center;gap:2px}
.wide{width:100%}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin-right:-18px;scrollbar-width:none}

.sw{display:flex;gap:10px;margin-bottom:16px}.sw button{width:40px;min-width:40px;height:40px;min-height:40px;border-radius:50%}

.ss{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:8px;background:var(--btn);color:var(--btn-ink);font:600 13px Mitr,sans-serif;margin-right:6px;vertical-align:2px}
.sslink{display:flex;align-items:center;justify-content:center;gap:6px;margin:-6px 0 8px;font:500 13px Mitr,sans-serif;color:var(--mute)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font:500 13px Mitr,sans-serif;color:var(--mute);text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td:first-child{width:34px;font:600 15px Mitr,sans-serif}

.chk{width:46px;height:44px;background:var(--chip);display:grid;place-items:center;color:var(--mute);border-radius:50%}

.prb{display:inline-block;background:var(--s-yellow);color:#4a2c22;border-radius:6px;font:600 11px Mitr,sans-serif;padding:0 5px;margin-left:2px;vertical-align:middle}
.addset{width:100%;background:var(--chip);border-radius:14px;margin-top:4px;font-size:15px}
.notein{width:100%;margin-top:8px;font:15px Mali,sans-serif;color:var(--ink);background:transparent;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.exfoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.exfoot button[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.wtop{position:sticky;top:0;z-index:5;margin:0 -18px 14px;padding:calc(env(safe-area-inset-top) + 10px) 18px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.meta{display:flex;gap:16px;font-size:14px;color:var(--mute);flex-wrap:wrap}.meta b{font:600 18px Mitr,sans-serif;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}

.resume{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--btn);color:var(--btn-ink);border-radius:22px;padding:10px 10px 10px 18px;margin-bottom:14px}
.resume span{background:var(--btn-ink);color:var(--btn);border-radius:99px;padding:8px 14px;white-space:nowrap}
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.sched button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:70px;padding:6px 2px;border-radius:16px;background:var(--chip);font:600 14px Mitr,sans-serif;line-height:1.2}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:8px}

.cal button{min-height:46px;padding:2px;border-radius:14px;font:500 13px Mitr,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cal button svg{width:26px;height:26px}
.cal .td{box-shadow:inset 0 0 0 2px var(--btn)}.cal .sel{background:var(--t-yellow)}
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}

.hd{display:flex;gap:12px;align-items:center}.hd svg{width:42px;flex:none}
.hd h3{margin:0;font-size:17px;font-weight:600}.hd small{font-size:13px;color:var(--mute)}
.hv{text-align:right;font-size:13px;white-space:nowrap;color:var(--mute)}.hv b{display:block;font:600 16px Mitr,sans-serif;color:var(--ink)}
.hx{margin:12px 0 0;padding:0;list-style:none;font-size:15px}.hx li{padding:8px 0;border-top:1px solid var(--line)}.hx b{display:block;font-family:Mitr,sans-serif;font-weight:500}
.danger{color:var(--red);font-weight:500;margin-top:6px}

.hrow{display:grid;grid-template-columns:9.5em minmax(0,1fr) 3em;gap:8px;align-items:center;margin:8px 0;font-size:15px}

.meter{height:16px;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px}
.xchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;flex:none}
.chip{min-height:44px}
.chip{flex:none;background:var(--card);padding:0 16px;font-size:15px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}

.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:default}

.txt{width:100%;font:16px Mali,sans-serif;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:14px;padding:10px 14px;min-height:48px}
.txt:focus{border-color:var(--btn);outline:none}
label.lb{display:block;font:500 14px Mitr,sans-serif;color:var(--mute);margin:12px 0 6px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:6;width:min(524px,calc(100% - 28px));background:var(--nav);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1.5px solid light-dark(#fff,rgba(255,255,255,.08));border-radius:32px;box-shadow:0 10px 30px rgba(60,100,150,.2);padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

.sheet{position:fixed;inset:0;background:rgba(20,30,45,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}

.panel{background:var(--bg);width:100%;max-width:560px;max-height:calc(100dvh - env(safe-area-inset-top) - 24px);border-radius:30px 30px 0 0;display:flex;flex-direction:column;padding:16px max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}

function drawChart(){
  const s = $('chart'), pe = $('pts'); if (!s || !pe) return;

  const y0 = Math.max(0,lo-pad), y1 = hi+pad, X = i => pts.length<2 ? L+(Wd-L-R)/2 : L+i*(Wd-L-R)/(pts.length-1), Y = v => T+(1-(v-y0)/(y1-y0))*(Ht-T-B);
  let g = '';
  for (let k=0;k<3;k++){ const v = y0+(y1-y0)*k/2; g += `<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${ink}" stroke-opacity=".15" stroke-dasharray="4 5"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" font-family="Mitr" fill="${ink}" fill-opacity=".7">${fmt(Math.round(v*2)/2)}</text>`; }
  g += `<path d="${pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join('')}" fill="none" style="stroke:var(--btn)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${p.v===hi?7:5}" style="fill:${p.v===hi?'#ffd36b':'var(--card)'};stroke:var(--btn)" stroke-width="2.5"><title>${new Date(p.d).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}: ${p.v}</title></circle>`).join('');
  const lab = i => `<text x="${X(i)}" y="${Ht-4}" text-anchor="${i?'end':'start'}" font-size="12" font-family="Mitr" fill="${ink}" fill-opacity=".7">${new Date(pts[i].d).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</text>`;

}

/* next-session suggestion: last time every planned set hit its reps -> add weight */
function suggest(it){
  const last = lastSets(it.ex); if (!last || !it.sets.length) return null;
  const ok = it.sets.every((s,j)=>last[j] && (+last[j].reps||0) >= (+s.reps||0) && (+last[j].w||0) >= (+s.w||0));
  const top = Math.max(...last.map(s=>+s.w||0)); if (!ok || !top) return null;
  const step = (EXINFO[it.ex]||{}).eq==='D' ? 1 : 2.5, w = top + step;
  return it.sets.some(s=>(+s.w||0) < w) ? w : null;
}
const PLATES = [[25,'#ff6b5b'],[20,'#8cc8ff'],[15,'#ffd36b'],[10,'#7fdc9a'],[5,'#fff'],[2.5,'#b49cff'],[1.25,'#d8d2cc']];

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey && !/^ใส่/.test(cfg.apiKey)) {
  const app = initializeApp(cfg), auth = getAuth(app), db = initializeFirestore(app, { localCache: persistentLocalCache() });
  window.FB = { user: null,
    login: async () => { const p = new GoogleAuthProvider(); try { await signInWithPopup(auth, p); } catch (e) { if (e.code !== 'auth/popup-closed-by-user') await signInWithRedirect(auth, p); } },
    logout: () => signOut(auth),
    load: async (uid) => { const s = await getDoc(doc(db, 'users', uid)); return s.exists() ? s.data().state : null; },
    // shortcut: whole state in one document (1 MiB limit, ~500+ workouts); split history into a subcollection when it grows
    save: (uid, state) => setDoc(doc(db, 'users', uid), { state: JSON.parse(JSON.stringify(state)), updated: Date.now() }) };
  onAuthStateChanged(auth, u => { window.FB.user = u; dispatchEvent(new CustomEvent('fb-auth', { detail: u })); });
}
